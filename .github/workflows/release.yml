name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Publish only when the test suite passes.
      - name: Test
        run: dotnet test Stickmark.Tests/Stickmark.Tests.csproj -c Release --verbosity normal

      - name: Publish self-contained single-file application
        shell: pwsh
        run: |
          dotnet publish Stickmark/Stickmark.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v', 'V')
          & iscc "/DAppVersion=$version" "packaging\Stickmark.iss"
          $setup = "artifacts/installer/Stickmark-$version-win-x64-setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created: $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $setup)" | Out-File -Encoding ascii "$setup.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/installer/Stickmark-*-win-x64-setup.exe
            artifacts/installer/Stickmark-*-win-x64-setup.exe.sha256
          generate_release_notes: true
