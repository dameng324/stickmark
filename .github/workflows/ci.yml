name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test Stickmark.Tests/Stickmark.Tests.csproj -c Release --no-build --verbosity normal

  # Verify that the committed CodeMirror editor bundle matches the source.
  editor-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild editor bundle and verify it matches the committed asset
        shell: bash
        working-directory: tools/mdeditor
        run: |
          npm ci
          npm test
          npm run build
          if ! diff --strip-trailing-cr -q dist/mdeditor.bundle.js ../../Stickmark/Assets/mdeditor/mdeditor.bundle.js; then
            echo "::error::Editor bundle is out of date. Run 'npm run build' in tools/mdeditor and copy dist/mdeditor.bundle.js to Stickmark/Assets/mdeditor/."
            exit 1
          fi
          echo "Editor bundle is up to date."
